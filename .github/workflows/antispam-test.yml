name: Malware guard regression tests
on:
  pull_request:
    paths: ['.github/scripts/issue-malware-guard*', '.github/workflows/antispam*']
  push:
    branches: [main]
    paths: ['.github/scripts/issue-malware-guard*', '.github/workflows/antispam*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test .github/scripts/issue-malware-guard.test.cjs
