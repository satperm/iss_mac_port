name: Anti-Spam and Malware Guard

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to inspect (no bulk scanning)
        required: true
        type: string
      dry_run:
        description: Report only; do not moderate
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: malware-${{ github.event.issue.number || inputs.issue_number }}-${{ github.event.comment.id || 'issue' }}
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Issue events use default branch code, never a branch supplied by a reporter.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Scan untrusted issue content
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { moderate } = require('./.github/scripts/issue-malware-guard.cjs');
            await moderate({ github, context, core });
